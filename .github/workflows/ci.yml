name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Coverage drop gate (F4) reads the coverage artifact of the latest
  # successful main run via the gh API on pull_request events.
  actions: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run casbin SQL lint guard
        run: bash scripts/lint-casbin-sql.sh

      - name: Run OpenAPI drift gate
        run: go run ./cmd/openapi-drift

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

  coverage-gate:
    name: Coverage drop gate (F4)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      # No setup-go: the comparison script parses coverprofile lines with
      # awk and never resolves source files (deliberately — profiles may
      # reference files absent from this checkout).
      - uses: actions/checkout@v7

      - name: Download PR coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-profile
          path: /tmp/coverage-pr

      - name: Fetch main baseline profile
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --branch main --status completed --limit 10 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "::warning::No successful main run found — coverage gate passes uncompared (bootstrap)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif gh run download "$RUN_ID" -n coverage-profile -D /tmp/coverage-main; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Main baseline artifact unavailable (expired?) — coverage gate passes uncompared."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if coverage dropped more than 1pt below main
        if: steps.baseline.outputs.available == 'true'
        run: bash scripts/check-coverage-drop.sh /tmp/coverage-pr/coverage.out /tmp/coverage-main/coverage.out 1.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build API
        run: go build ./cmd/api

      - name: Build Worker
        run: go build ./cmd/worker

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  integration-rabbit:
    name: Integration (RabbitMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run RabbitMQ live-broker integration tests
        run: go test -race -tags=integration ./internal/adapter/queue/... ./internal/worker/...
